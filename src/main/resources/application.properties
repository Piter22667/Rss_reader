spring.application.name=rss

spring.datasource.url=jdbc:postgresql://localhost:5432/Rss_reader

spring.flyway.enabled=true

spring.datasource.username=edit_username
spring.datasource.password=edit_password
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.hibernate.ddl-auto=validate

spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

brightdata.api.token=
brightdata.zone=
brightdata.api.url=https://api.brightdata.com/request

# OpenRouter (OpenAI-compatible API)
spring.ai.openai.api-key=
spring.ai.openai.base-url=https://openrouter.ai/api/v1
spring.ai.openai.chat.model=openai/gpt-6-luna
spring.ai.openai.chat.reasoning-effort=low

# Automatic RSS feed refresh
rss.scheduler.enabled=true
rss.scheduler.interval-ms=300000
rss.scheduler.initial-delay-ms=60000
# How many of the newest articles per feed may be fetched from Bright Data (>= feed size means no limit)
rss.import.brightdata.limit=20
rss.import.brightdata.threads=4

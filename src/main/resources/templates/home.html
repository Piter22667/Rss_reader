<!doctype html>
<html lang="uk" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Мої джерела — RSS Reader</title>
  <link rel="stylesheet" th:href="@{/css/auth.css}">
  <link rel="stylesheet" th:href="@{/css/home.css}">
</head>
<body class="home">
<div class="workspace">
  <header class="topbar">
    <a class="brand-name brand-link" th:href="@{/}">RSS Reader</a>
    <div class="account">
      <span class="account-email" th:text="${email}"></span>
      <form th:action="@{/logout}" method="post">
        <button class="btn btn-secondary" type="submit">Вийти</button>
      </form>
    </div>
  </header>
  <div th:if="${success}" class="alert alert-success" role="status" th:text="${success}"></div>
  <div th:if="${importError}" class="alert" role="alert" th:text="${importError}"></div>
  <div class="layout">
    <aside class="panel sources-panel" aria-label="Керування RSS-джерелами">
      <div class="section-heading">
        <h1>Мої джерела</h1>
        <span class="count" th:text="${#lists.size(sources)}"></span>
      </div>
      <p class="subtitle">Зберігайте улюблені RSS та Atom стрічки.</p>
      <ul class="source-list" th:if="${!#lists.isEmpty(sources)}">
        <li th:each="source : ${sources}" class="source-row"
            th:classappend="${selectedSource != null and selectedSource.id == source.id} ? 'selected'">
          <a class="source-link" th:href="@{/(feedId=${source.id})}"
             th:attr="aria-current=${selectedSource != null and selectedSource.id == source.id ? 'page' : null}">
            <div class="source-heading">
              <span class="source-icon" aria-hidden="true">
                <span class="source-icon-fallback">◉</span>
                <img th:if="${source.faviconUrl != null}" th:src="${source.faviconUrl}"
                     alt="" width="24" height="24" loading="lazy" referrerpolicy="no-referrer"
                     onerror="this.remove()">
              </span>
              <strong th:text="${source.name}"></strong>
            </div>
            <span th:text="${source.url}"></span>
          </a>
          <form th:action="@{/feeds/{id}/delete(id=${source.id})}" method="post"
                onsubmit="return confirm('Видалити це джерело разом зі статтями, вподобаннями та AI-підсумками?');">
            <button class="delete-button" type="submit"
                    th:attr="aria-label=${'Видалити джерело ' + source.name}">Видалити</button>
          </form>
        </li>
      </ul>
      <p class="empty-list" th:if="${#lists.isEmpty(sources)}">У вас ще немає RSS-джерел. Додайте перше нижче.</p>
      <section class="add-source">
        <h2>Додати джерело</h2>
        <form th:action="@{/feeds}" th:object="${form}" method="post" novalidate>
          <div class="field-wrap">
            <label for="name">Назва</label>
            <input id="name" class="field" th:field="*{name}" maxlength="255"
                   placeholder="Вкажіть назву джерела"
                   th:classappend="${#fields.hasErrors('name')} ? 'field-error'">
            <div class="err-msg" th:if="${#fields.hasErrors('name')}" th:errors="*{name}"></div>
          </div>
          <div class="field-wrap">
            <label for="url">RSS URL</label>
            <input id="url" class="field" th:field="*{url}" type="url" maxlength="2048"
                   placeholder="https://example.com/feed"
                   th:classappend="${#fields.hasErrors('url') or #fields.hasErrors('validUrl')} ? 'field-error'">
            <div class="err-msg" th:if="${#fields.hasErrors('url')}" th:errors="*{url}"></div>
            <div class="err-msg" th:if="${#fields.hasErrors('validUrl')}" th:errors="*{validUrl}"></div>
          </div>
          <button class="btn" type="submit">Додати джерело</button>
        </form>
      </section>
    </aside>
    <main class="panel content-panel">
      <th:block th:if="${selectedSource != null}">
        <div class="feed-toolbar">
          <div>
            <p class="eyebrow">Вибране джерело</p>
            <h2 class="feed-title" th:text="${selectedSource.name}"></h2>
          </div>
          <form th:action="@{/feeds/{id}/import(id=${selectedSource.id})}" method="post" data-import-form>
            <button class="btn import-button" type="submit">⟳ Оновити</button>
          </form>
        </div>
        <p class="feed-url" th:text="${selectedSource.url}"></p>
        <div class="feed-meta">
          <span th:text="${'Статей: ' + articlePage.totalElements}"></span>
          <span th:if="${lastFetchedAtLabel != null}" th:text="${'Оновлено: ' + lastFetchedAtLabel}"></span>
        </div>
        <div class="empty-content" th:if="${articlePage.totalElements == 0}">
          <span class="empty-icon" aria-hidden="true">☰</span>
          <h3 th:text="${selectedSource.lastFetchedAt == null ? 'Статті ще не завантажено' : 'Поки немає статей'}"></h3>
          <p th:text="${selectedSource.lastFetchedAt == null ? 'Натисніть «Оновити», щоб завантажити статті джерела.' : 'Стрічку перевірено, але придатних для збереження статей у ній немає.'}"></p>
        </div>
        <section class="article-list" th:if="${!#lists.isEmpty(articles)}" aria-label="Статті джерела" tabindex="0">
          <article class="article-card" th:each="article : ${articles}">
            <p class="article-date" th:if="${article.publishedAtLabel != null}" th:text="${article.publishedAtLabel}"></p>
            <h3 class="article-title" th:text="${article.title}"></h3>
            <p class="article-description" th:if="${article.description != null and !#strings.isEmpty(article.description)}" th:text="${article.description}"></p>
            <a class="article-original" th:if="${article.link != null}" th:href="${article.link}" target="_blank" rel="noopener noreferrer">Читати оригінал ↗</a>
          </article>
        </section>
        <nav class="pagination" th:if="${articlePage.totalPages > 1}" aria-label="Сторінки статей">
          <a class="page-link" th:if="${articlePage.hasPrevious()}" th:href="@{/(feedId=${selectedSource.id},page=${articlePage.number - 1})}">← Попередня</a>
          <span th:text="${'Сторінка ' + (articlePage.number + 1) + ' з ' + articlePage.totalPages}"></span>
          <a class="page-link" th:if="${articlePage.hasNext()}" th:href="@{/(feedId=${selectedSource.id},page=${articlePage.number + 1})}">Наступна →</a>
        </nav>
      </th:block>
      <div class="empty-content welcome" th:if="${selectedSource == null}">
        <span class="empty-icon" aria-hidden="true">＋</span>
        <h2>Ваші новини в одному місці</h2>
        <p>Додайте RSS-джерело у формі поруч, щоб почати.</p>
      </div>
    </main>
  </div>
</div>
<script th:src="@{/js/home.js}" defer></script>
</body>
</html>

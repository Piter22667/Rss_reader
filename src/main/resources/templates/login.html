<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Login — RSS Reader</title>
  <link rel="stylesheet" th:href="@{/css/auth.css}">
</head>
<body class="auth-login">
  <div class="card">
    <div class="brand">
      <span class="brand-name">RSS Reader</span>
    </div>
    <h1>Sign in</h1>
    <p class="subtitle">Enter your credentials to continue</p>

    <div th:if="${error}" class="alert alert-error" th:text="${error}"></div>
    <div th:if="${logout}" class="alert alert-success" th:text="${logout}"></div>
    <div th:if="${param.registered}" class="alert alert-success">
      Account created successfully. Please sign in.
    </div>

    <form th:action="@{/login}" method="post">
      <label for="username">Email</label>
      <input id="username" name="username" type="email" class="field"
             placeholder="you@example.com" autocomplete="email" autofocus required>

      <label for="password">Password</label>
      <input id="password" name="password" type="password" class="field"
             placeholder="••••••••" autocomplete="current-password" required>

      <button type="submit" class="btn">Sign in</button>
    </form>

    <p class="footer-link">
      Don't have an account? <a th:href="@{/register}">Create one</a>
    </p>
  </div>
</body>
</html>
